# Production stack for one VM: caddy (TLS) -> api, plus worker and db on a private network.
#
#   cp .env.prod.example /opt/signalnest/.env.prod && chmod 600 /opt/signalnest/.env.prod
#   docker compose -f docker-compose.prod.yml --env-file /opt/signalnest/.env.prod up -d --build
#
# Only caddy publishes ports (80/443). The database, API and worker metrics are reachable only
# on the compose network.

x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

x-app-env: &app-env
  ENV: prod
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  COOKIE_SECURE: "true"
  EXPOSE_DOCS: "false"
  ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
  # Must stay empty in production: no private ranges are reachable from probes.
  SSRF_ALLOW_PRIVATE_CIDRS: ""
  ALLOWED_HOSTS: ""
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  RUN_RETENTION_DAYS: ${RUN_RETENTION_DAYS:-14}
  PYTHONDONTWRITEBYTECODE: "1"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true

  migrate:
    build: { context: ., target: migrate }
    environment: *app-env
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  api:
    build: { context: ., target: api }
    <<: *hardening
    environment: *app-env
    # Behind caddy only: trust its X-Forwarded-For so rate limits see real client addresses.
    command:
      - uvicorn
      - app.main:app
      - --host=0.0.0.0
      - --port=8000
      - --proxy-headers
      - --forwarded-allow-ips=*
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2).status == 200 else 1)"
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    build: { context: ., target: worker }
    <<: *hardening
    environment: *app-env
    stop_grace_period: 30s
    depends_on:
      migrate: { condition: service_completed_successfully }

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: { condition: service_healthy }
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
