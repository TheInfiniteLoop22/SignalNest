name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run mypy backend/app faultline
      - run: uv run mypy --strict backend/app/probe backend/app/incidents backend/app/worker

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -m "not integration"

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: signalnest
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: signalnest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U signalnest -d signalnest"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://signalnest:change-me@localhost:5432/signalnest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -m integration

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build

  ops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck --severity=warning ops/*.sh
      - name: Production compose file is valid
        run: docker compose -f docker-compose.prod.yml --env-file .env.prod.example config --quiet
      - name: Caddyfile is valid
        run: >
          docker run --rm -e DOMAIN=example.com -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2 caddy validate --config /etc/caddy/Caddyfile
      - name: Production images build
        run: |
          docker build --target api -t signalnest-api .
          docker build --target worker -t signalnest-worker .

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks scans history, not just the tip
      - uses: astral-sh/setup-uv@v5
      - name: Python dependencies (known vulnerabilities)
        run: |
          uv sync --locked
          uv run pip-audit
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Frontend dependencies (high and above, runtime only)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Secret scan
        run: >
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source /repo
          --no-banner --redact

